<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập bị từ chối - Laptopshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1 class="error-code">403</h1>
        <h2 class="mb-4">Truy cập bị từ chối!</h2>
        <p class="text-muted mb-5">Rất tiếc, bạn không có quyền truy cập vào trang này.<br>Vui lòng liên hệ quản trị viên hoặc quay lại trang chủ.</p>
        <a th:href="@{/}" class="btn btn-primary btn-lg rounded-pill px-5">Quay về trang chủ</a>
    </div>
</body>

</html>
