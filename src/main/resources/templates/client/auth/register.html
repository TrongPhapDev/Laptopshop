<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Register - Laptopshop</title>
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap"
        rel="stylesheet" />

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Libraries Stylesheet -->
    <link href="/client/lib/lightbox/css/lightbox.min.css" rel="stylesheet" />
    <link href="/client/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/client/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Template Stylesheet -->
    <link href="/client/css/style.css" rel="stylesheet" />
</head>

<body class="bg-primary">
    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-7">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <div class="card-header">
                                    <h3 class="text-center font-weight-light my-4">
                                        Tạo tài khoản
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <form th:action="@{/register}" method="post" th:object="${registerUser}">
                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <div class="form-floating mb-3 mb-md-0">
                                                    <input class="form-control" id="inputFirstName" type="text"
                                                        placeholder="Enter your first name" th:field="*{firstName}"
                                                        th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" />
                                                    <label for="inputFirstName">Tên</label>
                                                    <div th:if="${#fields.hasErrors('firstName')}" 
                                                         th:text="${#fields.errors('firstName')[0]}" 
                                                         class="invalid-feedback"></div>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-floating">
                                                    <input class="form-control" id="inputLastName" type="text"
                                                        placeholder="Enter your last name" th:field="*{lastName}"
                                                        th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" />
                                                    <label for="inputLastName">Họ</label>
                                                    <div th:if="${#fields.hasErrors('lastName')}" 
                                                         th:text="${#fields.errors('lastName')[0]}" 
                                                         class="invalid-feedback"></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="inputEmail" type="email"
                                                placeholder="name@example.com" th:field="*{email}"
                                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" />
                                            <label for="inputEmail">Email</label>
                                            <div th:if="${#fields.hasErrors('email')}"
                                                th:text="${#fields.errors('email')[0]}" class="invalid-feedback"></div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <div class="form-floating mb-3 mb-md-0">
                                                    <input class="form-control" id="inputPassword" type="password"
                                                        placeholder="Create a password" th:field="*{password}"
                                                        th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" />
                                                    <label for="inputPassword">Mật khẩu</label>
                                                    <div th:if="${#fields.hasErrors('password')}"
                                                        th:text="${#fields.errors('password')[0]}"
                                                        class="invalid-feedback"></div>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-floating mb-3 mb-md-0">
                                                    <input class="form-control" id="inputPasswordConfirm"
                                                        type="password" placeholder="Confirm password"
                                                        th:field="*{confirmPassword}"
                                                        th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" />
                                                    <label for="inputPasswordConfirm">Xác nhận mật khẩu</label>
                                                    <div th:if="${#fields.hasErrors('confirmPassword')}"
                                                        th:text="${#fields.errors('confirmPassword')[0]}"
                                                        class="invalid-feedback" style="display: block;"></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mt-4 mb-0">
                                            <div class="d-grid">
                                                <button class="btn btn-primary btn-block" type="submit">
                                                    Tạo tài khoản
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center py-3">
                                    <div class="small">
                                        <a th:href="@{/login}">Bạn có tài khoản? Đi đến đăng nhập</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
