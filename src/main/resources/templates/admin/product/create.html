<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Create Product - SB Admin</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Sửa lại đoạn Script ở đầu file create.html -->
    <script>
        $(document).ready(() => {
            // Đổi từ #avatarFile sang #imageProductFile cho khớp với id mới của bạn
            const imageFile = $("#imageProductFile");
            imageFile.change(function (e) {
                const imgURL = URL.createObjectURL(e.target.files[0]);
                // Đổi từ #avatarPreview sang #imageProductPreview
                $("#imageProductPreview").attr("src", imgURL);
                $("#imageProductPreview").css({ display: "block" });
            });
        });
    </script>

    <link href="/admin/css/styles.css" rel="stylesheet" />

    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:replace="/admin/layout/header :: header"></div>
    <div id="layoutSidenav">
        <div th:replace="/admin/layout/sidebar :: sidebar"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Product</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item active">Products</li>
                    </ol>
                    <div class="container mt-5">
                        <div class="row justify-content-center">
                            <div class="col-md-9 col-lg-7">
                                <div class="card shadow">
                                    <div class="card-header text-center bg-primary text-white">
                                        <h4 class="mb-0">Product Information</h4>
                                    </div>

                                    <div class="card-body p-4">
                                        <form th:action="@{/admin/product/create}" th:object="${product}" method="post"
                                            enctype="multipart/form-data">
                                            <div class="row g-3">
                                                <!-- Name -->
                                                <div class="col-md-6">
                                                    <label class="form-label">Name</label>
                                                    <input type="text" class="form-control" th:field="*{name}"
                                                        placeholder="Enter name" />
                                                </div>

                                                <!-- Price -->
                                                <div class="col-md-6">
                                                    <label class="form-label">Price</label>
                                                    <input type="number" step="0.01" class="form-control"
                                                        th:field="*{price}" placeholder="Enter price" />
                                                </div>

                                                <!-- Detail description -->
                                                <div class="col-12">
                                                    <label class="form-label">Detail description</label>
                                                    <textarea class="form-control" th:field="*{detailDesc}" rows="3"
                                                        placeholder="Enter detail description"></textarea>
                                                </div>

                                                <!-- Short description -->
                                                <div class="col-md-6">
                                                    <label class="form-label">Short description</label>
                                                    <input type="text" class="form-control" th:field="*{shortDesc}"
                                                        placeholder="Enter short description" />
                                                </div>

                                                <!-- Quantity -->
                                                <div class="col-md-6">
                                                    <label class="form-label">Quantity</label>
                                                    <input type="number" class="form-control" th:field="*{quantity}"
                                                        placeholder="Enter quantity" />
                                                </div>

                                                <!-- Factory -->
                                                <div class="col-md-6">
                                                    <label class="form-label">Factory</label>
                                                    <select class="form-select" th:field="*{factory}">
                                                        <option value="">-- Select Factory --</option>
                                                        <option value="APPLE">Apple (MacBook)</option>
                                                        <option value="ASUS">Asus</option>
                                                        <option value="DELL">Dell</option>
                                                        <option value="HP">HP</option>
                                                        <option value="LENOVO">Lenovo</option>
                                                        <option value="ACER">Acer</option>
                                                    </select>
                                                </div>

                                                <!-- Target -->
                                                <div class="col-md-6">
                                                    <label class="form-label">Target</label>
                                                    <select class="form-select" th:field="*{target}">
                                                        <option value="">-- Select Target --</option>
                                                        <option value="GAMING">Gaming</option>
                                                        <option value="STUDY">Study</option>
                                                        <option value="OFFICE">Office</option>
                                                        <option value="PREMIUM">Premium</option>
                                                    </select>
                                                </div>

                                                <!-- Image -->
                                                <div class="col-md-12">
                                                    <label class="form-label">Product Image</label>
                                                    <input type="file" class="form-control" name="imageFile"
                                                        id="imageProductFile" accept="image/*" />
                                                    <img id="imageProductPreview" src="#" alt="Image preview"
                                                        class="mt-3 rounded shadow-sm" style="
                                                        display: none;
                                                        width: 200px;
                                                        height: auto;
                                                        object-fit: cover;
                                                      " />
                                                </div>

                                                <!-- Button -->
                                                <div class="col-12 text-end mt-4">
                                                    <button type="submit" class="btn btn-primary px-5">
                                                        Create Product
                                                    </button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <div th:replace="/admin/layout/footer :: footer"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="/admin/js/scripts.js"></script>
</body>

</html>
