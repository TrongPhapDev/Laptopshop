<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Product Detail - SB Admin</title>
    <link href="/admin/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:replace="/admin/layout/header :: header"></div>
    <div id="layoutSidenav">
        <div th:replace="/admin/layout/sidebar :: sidebar"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Product Detail</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/admin/product">Products</a></li>
                        <li class="breadcrumb-item active">Detail</li>
                    </ol>
                    <div class="row justify-content-center">
                        <div class="col-lg-10">
                            <div class="card shadow mb-4">
                                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                                    <h5 class="m-0">Information for Product ID: <span th:text="${product.id}"></span></h5>
                                    <a th:href="@{/admin/product/update/{id}(id=${product.id})}" class="btn btn-warning btn-sm">Edit</a>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <!-- Cột bên trái: Ảnh và thông tin cơ bản -->
                                        <div class="col-md-4 text-center border-end">
                                            <div class="mb-3">
                                                <img th:if="${product.image}" 
                                                     th:src="@{/product/{filename}(filename=${product.image})}"
                                                     alt="Product Image" 
                                                     class="img-fluid rounded shadow-sm"
                                                     style="max-width: 100%; height: auto; max-height: 300px; object-fit: contain;" />
                                                <div th:unless="${product.image}" class="bg-light p-5 rounded">
                                                    <i class="fas fa-image fa-4x text-muted"></i>
                                                    <p class="text-muted mt-2">No image available</p>
                                                </div>
                                            </div>
                                            <h3 class="fw-bold text-dark mb-2" th:text="${product.name}"></h3>
                                            <p class="text-primary fs-3 fw-bold mb-0">
                                                <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span> đ
                                            </p>
                                        </div>
                                        
                                        <!-- Cột bên phải: Thông số chi tiết -->
                                        <div class="col-md-8 ps-md-4">
                                            <div class="row mb-4">
                                                <div class="col-sm-6 mb-3">
                                                    <label class="text-muted small text-uppercase fw-bold">Factory</label>
                                                    <p class="fs-5 mb-0" th:text="${product.factory}"></p>
                                                </div>
                                                <div class="col-sm-6 mb-3">
                                                    <label class="text-muted small text-uppercase fw-bold">Target</label>
                                                    <p class="fs-5 mb-0" th:text="${product.target}"></p>
                                                </div>
                                                <div class="col-sm-6 mb-3">
                                                    <label class="text-muted small text-uppercase fw-bold">Stock Quantity</label>
                                                    <p class="fs-5 mb-0" th:text="${product.quantity}"></p>
                                                </div>
                                                <div class="col-sm-6 mb-3">
                                                    <label class="text-muted small text-uppercase fw-bold">Sold</label>
                                                    <p class="fs-5 mb-0" th:text="${product.sold}"></p>
                                                </div>
                                            </div>

                                            <div class="mb-4">
                                                <label class="text-muted small text-uppercase fw-bold">Short Description</label>
                                                <p class="mb-0" th:text="${product.shortDesc}"></p>
                                            </div>

                                            <div class="bg-light p-3 rounded">
                                                <label class="text-muted small text-uppercase fw-bold mb-2">Detail Description</label>
                                                <p class="mb-0" th:text="${product.detailDesc}"></p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer bg-white text-end">
                                    <a href="/admin/product" class="btn btn-secondary px-4">
                                        <i class="fas fa-arrow-left me-2"></i>Back to List
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <div th:replace="/admin/layout/footer :: footer"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/admin/js/scripts.js"></script>
</body>

</html>
