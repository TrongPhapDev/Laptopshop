<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="/admin/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col-12 mx-auto">
          <h3>User Detail with id: <span th:text="${user.id}"></span></h3>

          <div class="card" style="width: 60%">
            <ul class="list-group list-group-flush">
              <li class="list-group-item">
                ID: <span th:text="${user.id}"></span>
              </li>
              <li class="list-group-item">
                EMAIL: <span th:text="${user.email}"></span>
              </li>
              <li class="list-group-item">
                FULL NAME: <span th:text="${user.fullName}"></span>
              </li>
              <li class="list-group-item">
                AVATAR:
                <img
                  th:if="${user.avatar}"
                  th:src="@{/avatar/{filename}(filename=${user.avatar})}"
                  alt="Avatar"
                  style="
                    width: 100px;
                    height: 100px;
                    object-fit: cover;
                    border-radius: 5px;
                  "
                />
                <span th:if="!${user.avatar}">No avatar</span>
              </li>
            </ul>
          </div>

          <a href="/admin/user" class="btn btn-primary mt-3">Back</a>
        </div>
      </div>
    </div>
  </body>
</html>
