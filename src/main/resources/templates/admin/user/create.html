<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Dashboard - SB Admin</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script>
    $(document).ready(() => {
      const avatarFile = $("#avatarFile");
      avatarFile.change(function (e) {
        const imgURL = URL.createObjectURL(e.target.files[0]);
        $("#avatarPreview").attr("src", imgURL);
        $("#avatarPreview").css({ display: "block" });
      });
    });
  </script>
  <link href="/admin/css/styles.css" rel="stylesheet" />

  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
  <div th:replace="/admin/layout/header :: header"></div>
  <div id="layoutSidenav">
    <div th:replace="/admin/layout/sidebar :: sidebar"></div>
    <div id="layoutSidenav_content">
      <main>
        <div class="container-fluid px-4">
          <h1 class="mt-4">Manage Order</h1>
          <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
            <li class="breadcrumb-item active">Orders</li>
          </ol>
          <div class="container mt-5">
            <div class="row justify-content-center">
              <div class="col-md-6">
                <div class="card shadow">
                  <div class="card-header text-center bg-primary text-white">
                    <h4>User Information</h4>
                  </div>

                  <div class="card-body">
                    <form th:action="@{/admin/user/create}" th:object="${user}" method="post"
                      enctype="multipart/form-data">
                      <div class="row g-3">
                        <!-- Email -->
                        <div class="col-md-6">
                          <label class="form-label">Email</label>
                          <input type="email" class="form-control" th:field="*{email}" placeholder="Enter email"
                            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" />
                          <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                          </div>
                        </div>

                        <!-- Password -->
                        <div class="col-md-6">
                          <label class="form-label">Password</label>
                          <input type="password" class="form-control" th:field="*{password}"
                            placeholder="Enter password"
                            th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" />
                          <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}"></div>
                        </div>

                        <!-- Phone -->
                        <div class="col-md-6">
                          <label class="form-label">Phone number</label>
                          <input type="text" class="form-control" th:field="*{phone}"
                            placeholder="Enter phone number" />
                        </div>

                        <!-- Full name -->
                        <div class="col-md-6">
                          <label class="form-label">Full Name</label>
                          <input type="text" class="form-control" th:field="*{fullName}" placeholder="Enter full name"
                            th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" />
                          <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                            th:errors="*{fullName}"></div>
                        </div>

                        <!-- Address (full width) -->
                        <div class="col-12">
                          <label class="form-label">Address</label>
                          <textarea class="form-control" th:field="*{address}" rows="2"
                            placeholder="Enter address"></textarea>
                        </div>

                        <!-- Role -->
                        <div class="col-md-6">
                          <label class="form-label">Role</label>
                          <select class="form-select" name="roleId">
                            <option value="">-- Select role --</option>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"
                              th:selected="${r.id == roleId}"></option>
                          </select>
                        </div>

                        <!-- Avatar -->
                        <div class="col-md-6">
                          <label class="form-label">Avatar</label>
                          <input type="file" class="form-control" name="avatarFile" id="avatarFile" />
                          <img id="avatarPreview" src="#" alt="Avatar preview" class="mt-2 rounded" style="
                                display: none;
                                width: 120px;
                                height: 120px;
                                object-fit: cover;
                              " />
                        </div>

                        <!-- Button -->
                        <div class="col-12 text-end mt-3">
                          <button type="submit" class="btn btn-primary px-4">
                            Create
                          </button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div th:replace="/admin/layout/footer :: footer"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="/admin/js/scripts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
</body>

</html>
